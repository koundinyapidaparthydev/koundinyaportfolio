name: Scrape Jobs

# Runs every 30 minutes between 4 AM and 6 PM PDT (UTC-7)
# 4:00 AM PDT = 11:00 UTC   /   6:00 PM PDT = 01:00 UTC (next day)
on:
  schedule:
    # 11:00–23:30 UTC  →  4:00 AM–4:30 PM PDT
    - cron: "0,30 11-23 * * *"
    # 00:00–01:30 UTC  →  5:00 PM–6:30 PM PDT
    - cron: "0,30 0-1 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run job scraper
        run: node scripts/scrape-jobs.mjs
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
