name: Scrape Jobs → Generate Resumes → Auto-Apply

# Runs every 30 minutes between 4 AM and 6 PM PDT (UTC-7)
# 4:00 AM PDT = 11:00 UTC   /   6:00 PM PDT = 01:00 UTC (next day)
on:
  schedule:
    # 11:00–23:30 UTC  →  4:00 AM–4:30 PM PDT
    - cron: "0,30 11-23 * * *"
    # 00:00–01:30 UTC  →  5:00 PM–6:30 PM PDT
    - cron: "0,30 0-1 * * *"
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Validate scrape env
        run: node scripts/validate-pipeline-env.mjs --stage=scrape
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # ── Step 1: Scrape new jobs into Google Sheets ──────────────────────────
      - name: Scrape jobs
        run: node scripts/scrape-jobs.mjs
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}

      - name: Validate generate env
        run: node scripts/validate-pipeline-env.mjs --stage=generate
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}

      # ── Step 2: Generate tailored resumes for new jobs ──────────────────────
      - name: Generate tailored resumes
        run: node scripts/generate-applications.mjs
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          MAX_CONCURRENT: "2"

      # ── Step 3: Auto-apply to pending jobs ─────────────────────────────────

      - name: Validate apply env
        run: node scripts/validate-pipeline-env.mjs --stage=apply
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Auto-apply to jobs
        run: node scripts/auto-apply.mjs
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL || 'koundinyapidaparthy@gmail.com' }}
          APPLICANT_FIRST_NAME: ${{ secrets.APPLICANT_FIRST_NAME || 'Koundinya' }}
          APPLICANT_LAST_NAME: ${{ secrets.APPLICANT_LAST_NAME || 'Pidaparthy' }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE || '5512298660' }}
          APPLICANT_LINKEDIN: ${{ secrets.APPLICANT_LINKEDIN || 'https://linkedin.com/in/koundinyap' }}
          APPLICANT_PORTFOLIO: ${{ secrets.APPLICANT_PORTFOLIO || 'https://koundinyapidaparhty.vercel.app' }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          APPLY_LIMIT: "200"
          DRY_RUN: "false"
